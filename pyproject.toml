[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsuche-ausbildung"
version = "0.1.0"
description = "Modular automation suite for Bundesagentur für Arbeit Jobsuche (Ausbildung) with LLM export and agent plugins"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.15,<1",
    "rich>=13.9,<16",
    "mcp>=1.0,<3",
    "pyotp>=2.9,<3",
    "playwright==1.65.0",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
jobsuche = "jobsuche_pkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_api: live smoke test against public rest.arbeitsagentur.de API",
    "live_ba: optional live BA portal login smoke test (requires .env credentials)",
]
